[package]
name = "malasada"
version = "0.1.0"
edition = "2021"
rust-version = "1.94.1"

[dependencies]
axum = { version = "0.8.9", features = ["macros", "multipart"] }
tokio = { version = "1.53.1", features = ["full"] }
aws-config = "1.11.0"
aws-sdk-s3 = "1.144.0"
image = { version = "0.25.10", features = ["webp"] }
dotenvy = "0.15.7"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
regex = "1.13.1"
percent-encoding = "2.3.2"
bytes = "1.12.1"
tower-http = { version = "0.7.0", features = ["trace", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
futures = "0.3.34"
anyhow = "1.0.104"
webp = "0.3.1"
